}
:root[data-theme="dark"]{--bg:#25272b;--surface:#2f3237;--ink:#eeede8;--muted:#a7abb2;--red:#ef5a52;--on-red:#1d1d1d;--line:#454850;--err:#ff8f88;--stripe:#eeede8;color-scheme:dark}

.chartbox .hint{margin:8px 0 0}
.chartwrap{position:relative}

.ch-grid{stroke:var(--line);stroke-width:1}
.ch-rec{stroke:var(--ink);stroke-width:1.5;opacity:.7}

.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:4px;font-size:.85rem;white-space:nowrap;transform:translate(-50%,-100%);z-index:2}
.tip strong{display:block;font-size:1rem;font-variant-numeric:tabular-nums}
.tip i{display:inline-block;width:14px;height:2px;background:var(--red);vertical-align:middle;margin-right:6px}
.cmpsel{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:12px;max-width:560px;margin:0 0 14px}
select{font:inherit;font-weight:500;padding:10px 12px;border:2px solid var(--ink);border-radius:4px;background:var(--bg);color:var(--ink);min-width:0;width:100%}
select:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.tbl td.win{font-weight:900}
.tbl td.win .tag{color:var(--red)}
.strip{margin:0;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink)}
.you{font-weight:800}
.ok{color:var(--muted);margin:0}
.ok:empty,.err:empty{display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}

.tiles{list-style:none;margin:0 0 20px;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:820px}
.tile{display:flex;flex-direction:column;gap:2px;background:var(--surface);border:2px solid var(--ink);border-radius:4px;padding:14px 16px;min-width:0}
.tile .tp{font-weight:900;font-size:2.4rem;line-height:1}
.tile .tn{font-weight:800;overflow-wrap:anywhere}
.tile .tt{font-weight:900;font-size:1.5rem;font-variant-numeric:tabular-nums}
.tile .td{color:var(--muted);font-size:.85rem}
@media (max-width:520px){.tile{padding:10px 10px}.tile .tp{font-size:1.8rem}.tile .tt{font-size:1.1rem}.tile .tn{font-size:.9rem}.tile .td{font-size:.75rem}}
.tile.t1{background:var(--red);color:var(--on-red);border-color:var(--red)}
.tile.t1 .td{color:inherit;opacity:.85}

.kset legend{font-weight:800;font-size:.9rem;padding:0;margin-bottom:6px}
.kcs{display:flex;flex-wrap:wrap;gap:8px}
.kc{position:relative;display:inline-block}
.kc input{position:absolute;opacity:0;width:1px;height:1px;padding:0;border:0}
.kc label{display:block;font-size:1rem;font-weight:800;padding:10px 16px;border:2px solid var(--ink);border-radius:999px;cursor:pointer;min-width:3.4rem;text-align:center}
.kc input:checked+label{background:var(--red);border-color:var(--red);color:var(--on-red)}
.kc input:focus-visible+label{outline:3px solid var(--ink);outline-offset:3px}
.scroll{overflow-x:auto;max-width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.bar{display:flex;justify-content:space-between;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 0 0}

.avatar{width:28px;height:28px;border-radius:50%;flex:none}
.status{margin:14px 0 0;color:var(--muted);max-width:70ch}

.err{margin:0}
dialog{border:2px solid var(--ink);border-radius:4px;background:var(--surface);color:var(--ink);padding:22px;width:min(460px,92vw);max-height:92vh;overflow-y:auto}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog h2{font-size:1.4rem;margin:0 0 14px}
.stack{display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;font-weight:800;font-size:.9rem;gap:4px}
input{font:inherit;font-weight:500;padding:10px 12px;border:2px solid var(--ink);border-radius:4px;background:var(--bg);color:var(--ink);min-width:0;width:100%}
.hint{font-weight:500;color:var(--muted);font-size:.85rem;margin:0}
.dlgbtns{display:flex;gap:10px;flex-wrap:wrap}
[hidden]{display:none!important}
footer{padding:20px 0 36px;color:var(--muted);font-size:.9rem}
@media (prefers-reduced-motion:no-preference){.card{transition:background .15s,color .15s}}
</style>

<div class="kerb" aria-hidden="true"></div>
<main class="wrap">
  <div class="bar">
    <a class="brand" href="#">Gokarty</a>
    <div class="who" id="who" hidden></div>

  <section id="home" hidden>

    </div>

    <section class="sec" aria-labelledby="rankH">
      <div class="sh"><h2 id="rankH">Ranking toru</h2><button type="button" class="btn" id="addBtn" disabled>Dodaj przejazd</button></div>
      <div class="seg" role="group" aria-label="Zakres rankingu">

      <h2 id="cmpH">Porównanie kierowców</h2>
      <div class="cmpsel">
        <label for="cmpA">Kierowca A<select id="cmpA"></select></label>
        <label for="cmpB">Kierowca B<select id="cmpB"></select></label>
      </div>
      <p class="rival" id="cmpSum"></p>
      <div id="cmpOut"></div>
    </section>

    <section class="sec" id="histSec" aria-labelledby="hTitle" hidden>
      <h2 id="hTitle"></h2>
      <div id="stats"></div>
      <div id="chart"></div>
      <div id="hist"></div>

  </section>
</main>

<dialog id="dlgRide" aria-labelledby="dlgRideH">
  <form id="rideForm" class="stack" novalidate>
    <h2 id="dlgRideH">Dodaj przejazd</h2>
    <fieldset class="kset" id="rKartSet" hidden>
      <legend>Gokart</legend>
      <div class="kcs" id="rChips"></div>
    </fieldset>
    <label for="rKart" id="rKartL">Gokart
      <input id="rKart" type="text" maxlength="40" list="kartList" autocomplete="off" placeholder="model lub numer gokarta">
      <datalist id="kartList"></datalist>
    </label>
    <label for="rTime">Czas okrążenia
      <input id="rTime" type="text" inputmode="decimal" autocomplete="off" placeholder="np. 1:02.345, 58.4 albo 1.02.345">
      <span class="hint">Możesz pisać bez dwukropka: 1.02.345 to 1:02.345. Zakres od 0:15 do 10:00.</span>
    </label>
    <label for="rDate">Data
      <input id="rDate" type="date">

    <p class="ok" id="rOk" role="status"></p>

      <button type="submit" class="btn" id="rSave">Zapisz</button>

</dialog>

<div class="wrap"><footer>Tory gokartowe</footer></div>

function el(tag,text,cls){var e=document.createElement(tag);if(text!=null&&text!=='')e.textContent=text;if(cls)e.className=cls;return e}
function clear(n){n.textContent=''}

function fmtDate(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?m[3]+'.'+m[2]+'.'+m[1]:(s||'-')}

  if(m){
    if(+m[2]>59)return null;

  return ((m[1]?+m[1]:0)*60+sec)*1000+frac;

function renderChart(base,rec){
  var box=$('chart');clear(box);
  if(base.length<2){box.appendChild(el('p','Za mało przejazdów na wykres: potrzeba co najmniej dwóch.','msg'));return}
  var pts=base.map(function(r,i){return {r:r,i:i}}).sort(function(a,b){
    return a.r.date<b.r.date?-1:a.r.date>b.r.date?1:a.i-b.i;
  }).map(function(x){return x.r});
  var n=pts.length,NS='http://www.w3.org/2000/svg',W=420,H=240,L=58,R=16,T=16,B=34;
  var ms=pts.map(function(r){return r.ms}),mn=Math.min.apply(null,ms),mx=Math.max.apply(null,ms);
  var rmn=(rec!=null&&rec<mn)?rec:mn;
  var steps=[100,200,500,1000,2000,5000,10000,20000,30000,60000],step=60000;
  for(var k=0;k<steps.length;k++){if((mx-rmn)/steps[k]<=4){step=steps[k];break}}
  var lo=Math.floor(rmn/step)*step,hi=Math.ceil(mx/step)*step;
  if(hi===lo)hi=lo+step;
  function X(i){return L+(i/(n-1))*(W-L-R)}
  function Y(v){return T+(v-lo)/(hi-lo)*(H-T-B)}
  function S(tag,attrs,cls,text){
    var e=document.createElementNS(NS,tag);
    for(var a in attrs)e.setAttribute(a,attrs[a]);
    if(cls)e.setAttribute('class',cls);
    if(text!=null)e.textContent=text;
    return e;
  }
  var cb=el('div',null,'chartbox');
  cb.appendChild(el('h3','Postęp czasów'));
  var wrap=el('div',null,'chartwrap');
  var svg=S('svg',{viewBox:'0 0 '+W+' '+H,role:'img',tabindex:'0',
    'aria-label':'Wykres czasów w kolejnych przejazdach: od '+fmt(pts[0].ms)+' do '+fmt(pts[n-1].ms)+', najlepszy '+fmt(mn)+'. Dokładne wartości są w tabeli poniżej.'});
  for(var v=lo;v<=hi;v+=step){
    svg.appendChild(S('line',{x1:L,x2:W-R,y1:Y(v),y2:Y(v)},'ch-grid'));
    svg.appendChild(S('text',{x:L-8,y:Y(v)+4,'text-anchor':'end'},'ch-txt',fmt(v)));
  }
  if(rec!=null&&rec<mn){
    svg.appendChild(S('line',{x1:L,x2:W-R,y1:Y(rec),y2:Y(rec)},'ch-rec'));
    svg.appendChild(S('text',{x:W-R,y:Y(rec)-6,'text-anchor':'end'},'ch-txt','rekord toru '+fmt(rec)));
  }
  var d0=fmtDate(pts[0].date),d1=fmtDate(pts[n-1].date);
  if(d0===d1){
    svg.appendChild(S('text',{x:L,y:H-10},'ch-txt',d0));
  }else{
    svg.appendChild(S('text',{x:L,y:H-10},'ch-txt',d0));
    svg.appendChild(S('text',{x:W-R,y:H-10,'text-anchor':'end'},'ch-txt',d1));
  }
  svg.appendChild(S('polyline',{points:pts.map(function(r,i){return X(i).toFixed(1)+','+Y(r.ms).toFixed(1)}).join(' ')},'ch-line'));
  if(n<=60){
    pts.forEach(function(r,i){svg.appendChild(S('circle',{cx:X(i),cy:Y(r.ms),r:4},'ch-dot'))});
  }
  var ib=ms.indexOf(mn);
  svg.appendChild(S('circle',{cx:X(ib),cy:Y(mn),r:6},'ch-dot'));
  var right=X(ib)>W/2;
  svg.appendChild(S('text',{x:X(ib)+(right?-10:10),y:Y(mn)-10,'text-anchor':right?'end':'start'},'ch-txt','najlepszy '+fmt(mn)));
  var cross=S('line',{y1:T,y2:H-B,visibility:'hidden'},'ch-cross');
  var act=S('circle',{r:5,visibility:'hidden'},'ch-dot');
  svg.appendChild(cross);svg.appendChild(act);
  var hit=S('rect',{x:L,y:T,width:W-L-R,height:H-T-B},'ch-hit');
  svg.appendChild(hit);
  var tip=el('div',null,'tip');tip.hidden=true;
  wrap.appendChild(svg);wrap.appendChild(tip);
  cb.appendChild(wrap);
  cb.appendChild(el('p','Wyżej znaczy szybciej. Najedź na wykres albo użyj strzałek, żeby zobaczyć przejazd.','hint'));
  box.appendChild(cb);

  var cur=-1;
  function show(i){
    cur=i;
    var r=pts[i],rect=svg.getBoundingClientRect(),sx=rect.width/W;
    cross.setAttribute('x1',X(i));cross.setAttribute('x2',X(i));cross.setAttribute('visibility','visible');
    act.setAttribute('cx',X(i));act.setAttribute('cy',Y(r.ms));act.setAttribute('visibility','visible');
    clear(tip);
    var big=el('strong');big.appendChild(el('i'));big.appendChild(document.createTextNode(fmt(r.ms)));
    tip.appendChild(big);
    tip.appendChild(document.createTextNode(fmtDate(r.date)+' · '+(r.kart||'-')));
    tip.hidden=false;
    var px=Math.min(Math.max(X(i)*sx,tip.offsetWidth/2),rect.width-tip.offsetWidth/2);
    tip.style.left=px+'px';
    tip.style.top=(Y(r.ms)*sx-12)+'px';
  }
  function hide(){
    cur=-1;tip.hidden=true;
    cross.setAttribute('visibility','hidden');act.setAttribute('visibility','hidden');
  }
  function nearest(e){
    var rect=svg.getBoundingClientRect(),vx=(e.clientX-rect.left)/rect.width*W;
    return Math.max(0,Math.min(n-1,Math.round((vx-L)/(W-L-R)*(n-1))));
  }
  hit.addEventListener('pointermove',function(e){show(nearest(e))});
  hit.addEventListener('pointerdown',function(e){show(nearest(e))});
  hit.addEventListener('pointerleave',hide);
  svg.addEventListener('focus',function(){show(n-1)});
  svg.addEventListener('blur',hide);
  svg.addEventListener('keydown',function(e){
    if(e.key==='ArrowLeft'){e.preventDefault();show(Math.max(0,(cur<0?n-1:cur)-1))}
    else if(e.key==='ArrowRight'){e.preventDefault();show(Math.min(n-1,(cur<0?n-1:cur)+1))}
    else if(e.key==='Escape'){hide()}
  });
}

  var t=trackById(st.track);
  $('home').hidden=!!t;$('track').hidden=!t;
  if(t)renderTrack(t);else renderHome();
}

function kartInputs(){return document.querySelector('input[name="kart"]')}
function openRide(){
  if(!st.uid||!trackById(st.track))return;
  var mine=playerById(st.uid),rs=mine?ridesOf(mine,st.track):[];
  var kl=$('kartList');clear(kl);
  var seen={};
  st.players.forEach(function(p){ridesOf(p,st.track).forEach(function(r){
    if(r.kart&&!seen[r.kart]){seen[r.kart]=1;var o=document.createElement('option');o.value=r.kart;kl.appendChild(o)}
  })});
  var last=rs.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0})[0];
  var tk=trackById(st.track),ks=tk&&tk.karts;
  $('rKartSet').hidden=!ks;$('rKartL').hidden=!!ks;
  if(ks){
    var box=$('rChips');clear(box);
    ks.forEach(function(k,i){
      var w=el('span',null,'kc'),id='kart-'+i;
      var r=document.createElement('input');
      r.type='radio';r.name='kart';r.id=id;r.value=k;
      if(last&&last.kart===k)r.checked=true;
      var l=el('label',k);l.htmlFor=id;
      w.appendChild(r);w.appendChild(l);box.appendChild(w);
    });
  }
  $('rKart').value=last&&last.kart?last.kart:'';
  $('rTime').value='';
  $('rDate').value=todayISO();$('rDate').max=todayISO();
  $('rErr').textContent='';$('rOk').textContent='';
  $('dlgRide').showModal();
  var haveKart=ks?!!document.querySelector('input[name="kart"]:checked'):!!$('rKart').value;
  (haveKart?$('rTime'):(ks?kartInputs():$('rKart'))).focus();
}

async function saveRide(e){
  e.preventDefault();
  if(st.busy)return;
  var more=!!(e.submitter&&e.submitter.id==='rSaveMore');
  var tk=trackById(st.track),ks=tk&&tk.karts,er=$('rErr');
  $('rOk').textContent='';
  var kart;
  if(ks){var c=document.querySelector('input[name="kart"]:checked');kart=c?c.value:''}
  else kart=$('rKart').value.trim().replace(/\s+/g,' ').slice(0,40);
  var ms=parseTime($('rTime').value),date=$('rDate').value;
  if(!st.uid){er.textContent='Zaloguj się przez Google, aby dodać przejazd.';return}
  if(!kart){er.textContent=ks?'Wybierz gokart.':'Podaj gokart, np. model lub numer.';(ks?kartInputs():$('rKart')).focus();return}
  if(ms===null){er.textContent='Wpisz czas w formacie 1:02.345, 1.02.345 albo 58.4.';$('rTime').focus();return}
  if(ms<MIN_MS||ms>MAX_MS){er.textContent='Czas musi mieścić się między 0:15 a 10:00.';$('rTime').focus();return}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date>todayISO()){er.textContent='Wybierz datę, nie późniejszą niż dzisiaj.';$('rDate').focus();return}
  er.textContent='';
  var btn=more?$('rSaveMore'):$('rSave'),label=btn.textContent;
  st.busy=true;$('rSave').disabled=true;$('rSaveMore').disabled=true;btn.textContent='Zapisuję…';
  try{
    var ref=db.collection('players').doc(st.uid);
    var snap=await ref.get();
    var rides=snap.exists&&Array.isArray(snap.data().rides)?snap.data().rides.slice():[];
    if(rides.length>=MAX_RIDES)throw new Error('Osiągnięto limit '+MAX_RIDES+' przejazdów. Usuń stare, żeby dodać nowe.');
    rides.push({id:newId(),track:st.track,date:date,kart:kart,ms:ms});
    await ref.set({rides:rides}, {merge:true});
    st.sel=st.uid;st.del=null;
    if(more){
      $('rTime').value='';
      $('rOk').textContent='Zapisano '+fmt(ms)+'. Wpisz kolejny czas.';
      $('rTime').focus();
    }else{
      $('dlgRide').close();
      flash('Zapisano przejazd: '+fmt(ms));
    }
  }catch(err){
    er.textContent=errText(err);
  }finally{
    st.busy=false;$('rSave').disabled=false;$('rSaveMore').disabled=false;btn.textContent=label;
    render();
  }
}

async function removeRide(pid,rid){
  if(st.busy)return;
  st.busy=true;
  try{
    var ref=db.collection('players').doc(pid);
    var snap=await ref.get();
    if(snap.exists){
      var rides=(Array.isArray(snap.data().rides)?snap.data().rides:[]).filter(function(r){return r.id!==rid});
      await ref.set({rides:rides}, {merge:true});
    }
    st.del=null;
    flash('Przejazd usunięty.');
  }catch(err){
    st.del=null;setNote(errText(err),true);
  }finally{
    st.busy=false;render();
  }
}

function route(){
  st.track=(location.hash||'').replace('#','');
  st.sel=null;st.del=null;st.kart='';st.cmpA=null;st.cmpB=null;
  window.scrollTo(0,0);
  render();
}

// Logowanie przez Google
$('loginBtn').addEventListener('click', function(){
  var provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(function(error){
    setNote('Błąd logowania: ' + error.message, true);
  });
});

$('logoutBtn').addEventListener('click', function(){
  auth.signOut();
});

// Nasłuchiwanie stanu autoryzacji Firebase
auth.onAuthStateChanged(function(user){
  if(user){
    st.uid = user.uid;
    st.myName = user.displayName || 'Kierowca';
    st.avatar = user.photoURL || '';
    st.isOwner = false; // Możesz dostosować logikę właściciela jeśli potrzebujesz
  } else {
    st.uid = null;
    st.myName = '';
    st.avatar = '';
    st.isOwner = false;
  }
  render();
});

// Nasłuchiwanie bazy danych Firestore
db.collection('players').onSnapshot(function(s){
  st.loaded = true;
  st.players = s.docs.map(function(d){
    var v=d.data()||{};
    return {id:d.id,rides:Array.isArray(v.rides)?v.rides:[]};
  });
  render();
},function(error){
  st.fail = true;
  render();
});

function setPeriod(per){
  st.period=per;
  $('perAll').setAttribute('aria-pressed',per==='all');
  $('perMonth').setAttribute('aria-pressed',per==='month');
  render();
}

$('addBtn').addEventListener('click',openRide);
$('perAll').addEventListener('click',function(){setPeriod('all')});
$('perMonth').addEventListener('click',function(){setPeriod('month')});
$('cmpA').addEventListener('change',function(){
  var old=st.cmpA;st.cmpA=this.value;
  if(st.cmpB===st.cmpA)st.cmpB=old;
  renderCmp(st.track);
});
$('cmpB').addEventListener('change',function(){
  var old=st.cmpB;st.cmpB=this.value;
  if(st.cmpA===st.cmpB)st.cmpA=old;
  renderCmp(st.track);
});
$('rideForm').addEventListener('submit',saveRide);
$('rCancel').addEventListener('click',function(){$('dlgRide').close()});
window.addEventListener('hashchange',route);
route();

})();
</script>

</body></html>
